model:
  # HF Hub id (e.g. "facebook/dinov3-vits16-pretrain-lvd1689m") when
  # weights_path is empty, OR a torch.hub entrypoint name from Meta's
  # facebookresearch/dinov3 repo (e.g. "dinov3_vitl16") when weights_path
  # points at a local .pth checkpoint downloaded from Meta directly.
  name: "dinov3_vitl16"
  weights_path: "./dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  device: "auto"       # auto | cuda | cpu
  dtype: "auto"        # auto | float32 | float16 | bfloat16
  batch_size: 16
  normalize_embeddings: true

augmentation:
  count_per_image: 50
  width: 224
  height: 224
  save_images: true

storage:
  chroma_path: "./chroma_db"
  collection_name: "dinov3_images"
  distance: "cosine"

data:
  input_dir: "./data/input"
  augmented_dir: "./data/augmented"
